services:
  restful-to-mcp:
    build: .
    # image: your-registry/restful-to-mcp:latest
    container_name: restful-to-mcp
    restart: always
    ports:
      - "9002:9002"
    environment:
      # Server
      - MCP_SERVER_HTTP_PORT=9002
      - MCP_SERVER_GRPC_PORT=9005

      # PostgreSQL
      - MCP_DATA_DATABASE_PG_SOURCE=host=postgres user=postgres password=your_password dbname=restful_to_mcp port=5432 sslmode=disable TimeZone=Asia/Shanghai

      # Redis
      - MCP_DATA_REDIS_ADDR=redis
      - MCP_DATA_REDIS_PORT=6379
      - MCP_DATA_REDIS_USERNAME=
      - MCP_DATA_REDIS_PASSWORD=
      - MCP_DATA_REDIS_DEFAULT_DB=0

      # Nacos (optional)
      # - MCP_REGISTRY_NACOS_IPADDR=127.0.0.1
      # - MCP_REGISTRY_NACOS_PORT=8848
      # - MCP_REGISTRY_NACOS_NAMESPACE=public
      # - MCP_REGISTRY_NACOS_USERNAME=
      # - MCP_REGISTRY_NACOS_PASSWORD=

      # Log
      - MCP_LOG_LEVEL=info
      - MCP_LOG_PATH=./logs/log.log
    volumes:
      - ./logs:/app/logs:Z
      - ./tmp:/app/tmp:Z
    depends_on:
      - postgres
      - redis
    networks:
      - mcp-bridge

  postgres:
    image: postgres:16-alpine
    container_name: restful-to-mcp-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: your_password
      POSTGRES_DB: restful_to_mcp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - mcp-bridge

  redis:
    image: redis:7-alpine
    container_name: restful-to-mcp-redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - mcp-bridge

volumes:
  pgdata:

networks:
  mcp-bridge:
    driver: bridge
    name: mcp-bridge
